{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h4>Create Test Questions</h4>
        </div>
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="course_name" class="form-label">Course Name</label>
                    <input type="text" class="form-control" id="course_name" name="course_name" 
                           value="SOC342" placeholder="Enter course name" required>
                    <div class="form-text">Enter the course name exactly as it appears in quizzes</div>
                </div>
                <div class="mb-3">
                    <label for="num_questions" class="form-label">Number of Questions</label>
                    <input type="number" class="form-control" id="num_questions" name="num_questions" 
                           value="3" min="1" max="10" required>
                </div>
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">Create Test Questions</button>
                    <a href="{% url 'admin_view' %}" class="btn btn-secondary">Back to Admin</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
