<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Success - Quiz Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary-color: #4e73df;
            --secondary-color: #f8f9fc;
            --success-color: #1cc88a;
            --danger-color: #e74a3b;
            --warning-color: #f6c23e;
            --dark-color: #5a5c69;
            --light-color: #f8f9fc;
        }
        
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }
        
        body {
            background-color: var(--secondary-color);
            font-family: 'Nunito', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 450px;
            margin: 0 auto;
        }
        
        .success-card {
            background-color: white;
            box-shadow: 0 0.15rem 1.75rem 0 rgba(58, 59, 69, 0.15);
            border: none;
            border-radius: 0.35rem;
            width: 100%;
            text-align: center;
        }
        
        .success-header {
            padding: 2rem 1.5rem;
            background-color: #fff;
        }
        
        .success-icon {
            font-size: 4rem;
            color: var(--success-color);
            margin-bottom: 1.5rem;
        }
        
        .success-body {
            padding: 1.5rem;
        }
        
        .success-footer {
            padding: 1.5rem;
            background-color: #f8f9fc;
            border-top: 1px solid #e3e6f0;
        }
        
        .login-btn {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
            padding: 0.75rem 2rem;
            font-weight: 700;
        }
        
        .login-btn:hover {
            background-color: #2e59d9;
            border-color: #2653d4;
        }
        
        .countdown {
            font-weight: bold;
            color: var(--primary-color);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card success-card">
            <div class="success-header">
                <i class="fas fa-check-circle success-icon"></i>
                <h3 class="text-gray-900">Account Created Successfully!</h3>
            </div>
            <div class="success-body">
                <p class="mb-3">Your account has been created successfully. You can now login using your credentials.</p>
                <p class="mb-0">You will be redirected to the login page in <span id="countdown" class="countdown">5</span> seconds.</p>
            </div>
            <div class="success-footer">
                <a href="{% url 'login' %}" class="btn btn-primary login-btn">
                    <i class="fas fa-sign-in-alt me-2"></i>Login Now
                </a>
            </div>
        </div>
    </div>
    
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Countdown and redirect
            let seconds = 5;
            const countdownElement = document.getElementById('countdown');
            
            const interval = setInterval(function() {
                seconds--;
                if (countdownElement) {
                    countdownElement.textContent = seconds;
                }
                
                if (seconds <= 0) {
                    clearInterval(interval);
                    // Store success state in local storage before redirecting
                    localStorage.setItem('signupSuccess', 'true');
                    window.location.href = "{% url 'login' %}";
                }
            }, 1000);
        });
    </script>
</body>
</html>
